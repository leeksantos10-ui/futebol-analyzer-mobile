name: Build Football Lab APK
on:
  push:
    branches: [football-lab-apk]
    paths:
      - 'FootballLabAndroid/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p FootballLabAndroid assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballLab-debug-apk
          path: FootballLabAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
